name: v25.75 Windows Promotion Safety

on:
  push:
    branches: [main]
    paths:
      - '_runtime/HMS_Codex_WindowsRuntimeCaseContract.py'
      - '_runtime/HMS_Codex_TargetMachineCertificationV2575.py'
      - '_runtime/HMS_Codex_ExternalWindowsReviewPacketIngest.py'
      - '_runtime/HMS_Codex_ExternalWindowsEvidenceRunner.py'
      - '_runtime/HMS_Codex_ExternalWindowsEvidenceAdversarialFixtures.py'
      - '_runtime/HMS_Codex_ExternalWindowsSourceBindingProof.py'
      - '_runtime/HMS_Codex_ExternalWindowsCertificateSigner.py'
      - '_runtime/HMS_Codex_ExternalWindowsCertificatePreflight.py'
      - '_runtime/HMS_Codex_ExternalWindowsCertificateEnrollment.py'
      - '_runtime/HMS_Codex_ExternalWindowsSignerTrustContract.py'
      - '_runtime/HMS_Codex_ExternalWindowsSignerTrustFixtures.py'
      - '_runtime/HMS_Codex_ExternalWindowsCaseReportExporter.py'
      - '_runtime/HMS_Codex_ReviewerLocalIntegritySeal.py'
      - '_runtime/HMS_Codex_ReviewerTrustAuthoritySnapshot.py'
      - '_runtime/HMS_Codex_ReviewerReleaseAuthority.py'
      - '_runtime/HMS_Codex_ReviewerPacketImport.py'
      - '_runtime/HMS_Codex_WindowsEvidenceOrchestrator.py'
      - '_runtime/HMS_Codex_WindowsRecoveryContract.py'
      - '_runtime/HMS_Codex_WindowsRecoveryDialog.py'
      - '_runtime/HMS_Codex_WindowsOneShotElevation.py'
      - '_runtime/HMS_Codex_WindowsElevationCallerAudit.py'
      - '_runtime/HMS_Codex_WindowsRecoveryAdversarialSimulator.py'
      - '_runtime/HMS_Codex_WindowsUACRecoveryValidation.py'
      - '_runtime/HMS_Codex_WindowsUACValidationBundle.py'
      - '_runtime/HMS_Run_UAC_Validation.ps1'
      - '_runtime/HMS_Sign_Digest_With_Certificate.ps1'
      - '_runtime/HMS_Inspect_Evidence_Certificate.ps1'
      - '_runtime/HMS_Codex_CockpitLiveBaselineProvider.py'
      - '_runtime/HMS_Codex_PromotionReviewerActionPolicy.py'
      - '_runtime/HMS_Codex_PromotionGUIActionContract.py'
      - '_runtime/HMS_Codex_PromotionLauncherRaceProof.py'
      - '_runtime/HMS_Codex_WindowsPromotionDecisionLedger.py'
      - '_runtime/HMS_Codex_WindowsPromotionReviewWorkbench.py'
      - '_runtime/HMS_Codex_WindowsPromotionWorkbenchController.py'
      - '_runtime/HMS_Codex_WindowsPromotionE2EFixtures.py'
      - '_runtime/HMS_GUI_ENTRY.pyw'
      - '_runtime/HMS_GUI_REVIEW_ENTRY.pyw'
      - '_runtime/HMS_GUI_RECOVERY_ENTRY.pyw'
      - '_runtime/HMS_GUI_SAFE_FALLBACK.pyw'
      - 'HMS_AI_ROUTER.vbs'
      - 'HMS_VALIDATE_UAC_RECOVERY.cmd'
      - '.github/workflows/v2575-promotion-safety-windows.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  promotion-safety:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install crypto verifier dependency
        shell: pwsh
        run: python -m pip install --disable-pip-version-check cryptography
      - name: Parse certificate and operator PowerShell helpers
        shell: pwsh
        run: |
          foreach ($path in @('_runtime/HMS_Sign_Digest_With_Certificate.ps1','_runtime/HMS_Inspect_Evidence_Certificate.ps1','_runtime/HMS_Run_UAC_Validation.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
          }
      - name: Compile promotion modules and GUI entries
        shell: pwsh
        run: |
          python -m py_compile `
            _runtime/HMS_Codex_WindowsRuntimeCaseContract.py `
            _runtime/HMS_Codex_TargetMachineCertificationV2575.py `
            _runtime/HMS_Codex_ExternalWindowsReviewPacketIngest.py `
            _runtime/HMS_Codex_ExternalWindowsEvidenceRunner.py `
            _runtime/HMS_Codex_ExternalWindowsEvidenceAdversarialFixtures.py `
            _runtime/HMS_Codex_ExternalWindowsSourceBindingProof.py `
            _runtime/HMS_Codex_ExternalWindowsCertificateSigner.py `
            _runtime/HMS_Codex_ExternalWindowsCertificatePreflight.py `
            _runtime/HMS_Codex_ExternalWindowsCertificateEnrollment.py `
            _runtime/HMS_Codex_ExternalWindowsSignerTrustContract.py `
            _runtime/HMS_Codex_ExternalWindowsSignerTrustFixtures.py `
            _runtime/HMS_Codex_ExternalWindowsCaseReportExporter.py `
            _runtime/HMS_Codex_ReviewerLocalIntegritySeal.py `
            _runtime/HMS_Codex_ReviewerTrustAuthoritySnapshot.py `
            _runtime/HMS_Codex_ReviewerReleaseAuthority.py `
            _runtime/HMS_Codex_ReviewerPacketImport.py `
            _runtime/HMS_Codex_WindowsEvidenceOrchestrator.py `
            _runtime/HMS_Codex_WindowsRecoveryContract.py `
            _runtime/HMS_Codex_WindowsRecoveryDialog.py `
            _runtime/HMS_Codex_WindowsOneShotElevation.py `
            _runtime/HMS_Codex_WindowsElevationCallerAudit.py `
            _runtime/HMS_Codex_WindowsRecoveryAdversarialSimulator.py `
            _runtime/HMS_Codex_WindowsUACRecoveryValidation.py `
            _runtime/HMS_Codex_WindowsUACValidationBundle.py `
            _runtime/HMS_Codex_CockpitLiveBaselineProvider.py `
            _runtime/HMS_Codex_PromotionReviewerActionPolicy.py `
            _runtime/HMS_Codex_PromotionGUIActionContract.py `
            _runtime/HMS_Codex_PromotionLauncherRaceProof.py `
            _runtime/HMS_Codex_WindowsPromotionDecisionLedger.py `
            _runtime/HMS_Codex_WindowsPromotionReviewWorkbench.py `
            _runtime/HMS_Codex_WindowsPromotionWorkbenchController.py `
            _runtime/HMS_Codex_WindowsPromotionE2EFixtures.py `
            _runtime/HMS_GUI_ENTRY.pyw `
            _runtime/HMS_GUI_REVIEW_ENTRY.pyw `
            _runtime/HMS_GUI_RECOVERY_ENTRY.pyw `
            _runtime/HMS_GUI_SAFE_FALLBACK.pyw
      - name: Canonical seven-case contract proof
        shell: pwsh
        run: python _runtime/HMS_Codex_WindowsRuntimeCaseContract.py
      - name: Target-machine v25.75 artifact binding proof
        shell: pwsh
        run: python _runtime/HMS_Codex_TargetMachineCertificationV2575.py --proof
      - name: External certificate signer source contract
        shell: pwsh
        run: python _runtime/HMS_Codex_ExternalWindowsCertificateSigner.py
      - name: Certificate read-only preflight source contract
        shell: pwsh
        run: python _runtime/HMS_Codex_ExternalWindowsCertificatePreflight.py --proof
      - name: Certificate enrollment source contract
        shell: pwsh
        run: python _runtime/HMS_Codex_ExternalWindowsCertificateEnrollment.py --proof
      - name: Reviewer local integrity seal proof
        shell: pwsh
        run: python _runtime/HMS_Codex_ReviewerLocalIntegritySeal.py --proof
      - name: Reviewer trust authority snapshot proof
        shell: pwsh
        run: python _runtime/HMS_Codex_ReviewerTrustAuthoritySnapshot.py --proof
      - name: Reviewer release identity authority proof
        shell: pwsh
        run: python _runtime/HMS_Codex_ReviewerReleaseAuthority.py --proof
      - name: Reviewer packet import source contract
        shell: pwsh
        run: python _runtime/HMS_Codex_ReviewerPacketImport.py --proof
      - name: Bounded Windows evidence orchestrator proof
        shell: pwsh
        run: python _runtime/HMS_Codex_WindowsEvidenceOrchestrator.py proof
      - name: Windows recovery contract proof
        shell: pwsh
        run: python _runtime/HMS_Codex_WindowsRecoveryContract.py
      - name: Windows recovery dialog source proof
        shell: pwsh
        run: python _runtime/HMS_Codex_WindowsRecoveryDialog.py
      - name: Codex one-shot UAC source proof
        shell: pwsh
        run: python _runtime/HMS_Codex_WindowsOneShotElevation.py
      - name: Windows elevation caller identity audit
        shell: pwsh
        run: python _runtime/HMS_Codex_WindowsElevationCallerAudit.py
      - name: Windows recovery adversarial simulator proof
        shell: pwsh
        run: python _runtime/HMS_Codex_WindowsRecoveryAdversarialSimulator.py
      - name: Bounded UAC runtime validation harness proof
        shell: pwsh
        run: python _runtime/HMS_Codex_WindowsUACRecoveryValidation.py proof
      - name: Session-bound UAC validation bundle proof
        shell: pwsh
        run: python _runtime/HMS_Codex_WindowsUACValidationBundle.py proof
      - name: Windows PowerShell 5.1 UAC operator runner proof
        shell: powershell
        run: .\_runtime\HMS_Run_UAC_Validation.ps1 -Proof
      - name: Recovery-first GUI wrapper proof
        shell: pwsh
        run: python _runtime/HMS_GUI_RECOVERY_ENTRY.pyw --proof
      - name: External signer trust cryptographic contract
        shell: pwsh
        run: python _runtime/HMS_Codex_ExternalWindowsSignerTrustContract.py
      - name: External signer trust negative fixtures
        shell: pwsh
        run: python _runtime/HMS_Codex_ExternalWindowsSignerTrustFixtures.py
      - name: Seven-case exporter proof
        shell: pwsh
        run: python _runtime/HMS_Codex_ExternalWindowsCaseReportExporter.py --proof
      - name: Seven-case source binding proof
        shell: pwsh
        run: python _runtime/HMS_Codex_ExternalWindowsSourceBindingProof.py
      - name: Seven-case adversarial evidence fixtures
        shell: pwsh
        run: python _runtime/HMS_Codex_ExternalWindowsEvidenceAdversarialFixtures.py
      - name: External Windows packet exact-matrix crypto-anchor proof
        shell: pwsh
        run: python _runtime/HMS_Codex_ExternalWindowsReviewPacketIngest.py --proof
      - name: Trusted live baseline provider proof
        shell: pwsh
        run: python _runtime/HMS_Codex_CockpitLiveBaselineProvider.py
      - name: Reviewer action policy proof
        shell: pwsh
        run: python _runtime/HMS_Codex_PromotionReviewerActionPolicy.py
      - name: Promotion GUI action contract proof
        shell: pwsh
        run: python _runtime/HMS_Codex_PromotionGUIActionContract.py
      - name: Decision ledger concurrency proof
        shell: pwsh
        run: python _runtime/HMS_Codex_WindowsPromotionDecisionLedger.py proof
      - name: Launcher chain and click-time baseline race proof
        shell: pwsh
        run: python _runtime/HMS_Codex_PromotionLauncherRaceProof.py
      - name: Review workbench proof
        shell: pwsh
        run: python _runtime/HMS_Codex_WindowsPromotionReviewWorkbench.py --proof
      - name: Controller sealed-state replay-concurrency proof
        shell: pwsh
        run: python _runtime/HMS_Codex_WindowsPromotionWorkbenchController.py
      - name: Promotion E2E negative fixtures
        shell: pwsh
        run: python _runtime/HMS_Codex_WindowsPromotionE2EFixtures.py
      - name: Guarded GUI entry proof
        shell: pwsh
        run: python _runtime/HMS_GUI_ENTRY.pyw --proof
      - name: Reviewer policy GUI wrapper proof
        shell: pwsh
        run: python _runtime/HMS_GUI_REVIEW_ENTRY.pyw --proof
      - name: Promotion-disabled safe fallback proof
        shell: pwsh
        run: python _runtime/HMS_GUI_SAFE_FALLBACK.pyw --proof
