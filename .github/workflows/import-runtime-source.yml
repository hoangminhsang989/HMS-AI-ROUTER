name: Import HMS-AI-ROUTER runtime source

on:
  push:
    branches: [main]
    paths:
      - HMS_AI_ROUTER_RUNTIME_SOURCE.tar.xz
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hms-ai-router-runtime-import
  cancel-in-progress: false

jobs:
  import-runtime-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify and extract authoritative runtime source
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="HMS_AI_ROUTER_RUNTIME_SOURCE.tar.xz"
          EXPECTED_SHA256="28a3ca7bb0b66e1945db91f2368159b114a20c0b5a57d6ddc44b3f30972eb60d"

          if [[ ! -f "$ARCHIVE" ]]; then
            echo "No source archive present; nothing to import."
            exit 0
          fi

          echo "${EXPECTED_SHA256}  ${ARCHIVE}" | sha256sum -c -
          tar -tJf "$ARCHIVE" > /tmp/hms-ai-router-import-list.txt
          test -s /tmp/hms-ai-router-import-list.txt

          # Reject paths that could escape the repository before extraction.
          if grep -Eq '(^/|(^|/)\.\.(/|$))' /tmp/hms-ai-router-import-list.txt; then
            echo "Unsafe archive path detected."
            exit 1
          fi

          tar -xJf "$ARCHIVE"
          rm -f "$ARCHIVE"

      - name: Commit extracted source and remove transfer archive
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet && [[ -z "$(git status --porcelain)" ]]; then
            echo "No import changes."
            exit 0
          fi

          git config user.name "HMS-AI-ROUTER Importer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: import HMS-AI-ROUTER v25.74 runtime source"
          git push origin HEAD:main
