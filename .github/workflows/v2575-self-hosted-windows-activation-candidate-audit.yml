name: v25.75 Self-Hosted Windows Activation Candidate Audit (Fallback Only)

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact HMS-AI-ROUTER commit whose canonical Windows graph may be routed later
        required: true
        default: f520c3b2addc4f4375e59da3dfe961177cf1196d
        type: string
      expected_workflow_blob:
        description: Reviewed git blob SHA of canonical Windows Promotion Safety workflow
        required: true
        default: afa27ce43cc2f5103eecae478e5a8a13f2fc1ef8
        type: string

permissions:
  contents: read

concurrency:
  group: v2575-self-hosted-windows-fallback
  cancel-in-progress: false

jobs:
  activation-candidate-audit:
    runs-on: [self-hosted, Windows, X64, hms-ai-router-windows]
    timeout-minutes: 5
    env:
      HMS_TARGET_SHA: ${{ inputs.target_sha }}
      HMS_EXPECTED_WORKFLOW_BLOB: ${{ inputs.expected_workflow_blob }}
      HMS_TARGET_DIR: activation-target-${{ github.run_id }}-${{ github.run_attempt }}
      HMS_TOOLING_DIR: activation-tools-${{ github.run_id }}-${{ github.run_attempt }}
      HMS_CANDIDATE_NAME: hms-v2575-self-hosted-activation-${{ github.run_id }}-${{ github.run_attempt }}.yml
    steps:
      - name: Runner materialized
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_OS -ne 'Windows') { throw "Expected Windows runner, got '$env:RUNNER_OS'" }
          if ($env:RUNNER_ARCH -ne 'X64') { throw "Expected X64 runner, got '$env:RUNNER_ARCH'" }
          Write-Host 'SELF_HOSTED_WINDOWS_RUNNER_MATERIALIZED'

      - name: Refuse current-run workspace collision
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $candidate = Join-Path $env:RUNNER_TEMP $env:HMS_CANDIDATE_NAME
          foreach ($path in @($env:HMS_TARGET_DIR, $env:HMS_TOOLING_DIR, $candidate)) {
            if (Test-Path -LiteralPath $path) {
              throw "Refusing pre-existing current-run path '$path'"
            }
          }

      - name: Checkout exact target
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.target_sha }}
          path: activation-target-${{ github.run_id }}-${{ github.run_attempt }}
          clean: true
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact workflow tooling revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: activation-tools-${{ github.run_id }}-${{ github.run_attempt }}
          clean: true
          persist-credentials: false
          fetch-depth: 1

      - name: Generate and validate one-line activation candidate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tool = Join-Path $env:HMS_TOOLING_DIR 'scripts\generate_self_hosted_windows_activation_candidate.ps1'
          $target = Resolve-Path $env:HMS_TARGET_DIR
          $candidate = Join-Path $env:RUNNER_TEMP $env:HMS_CANDIDATE_NAME
          & $tool `
            -RepositoryRoot $target `
            -ExpectedCommit $env:HMS_TARGET_SHA `
            -ExpectedWorkflowBlob $env:HMS_EXPECTED_WORKFLOW_BLOB `
            -OutputPath $candidate

      - name: Independently require exactly one selector diff
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:HMS_TARGET_DIR '.github\workflows\v2575-promotion-safety-windows.yml'
          $candidate = Join-Path $env:RUNNER_TEMP $env:HMS_CANDIDATE_NAME
          if (-not (Test-Path -LiteralPath $candidate -PathType Leaf)) {
            throw 'Generated activation candidate is missing'
          }
          $diff = @(& git diff --no-index --unified=0 -- $source $candidate 2>&1)
          $exit = $LASTEXITCODE
          if ($exit -ne 1) {
            throw "Expected git diff --no-index exit 1 for one intentional change, got $exit"
          }
          $removed = @($diff | Where-Object { $_ -ceq '-    runs-on: windows-latest' })
          $added = @($diff | Where-Object { $_ -ceq '+    runs-on: [self-hosted, Windows, X64, hms-ai-router-windows]' })
          $otherPayload = @($diff | Where-Object {
            ($_ -match '^[+-]') -and
            ($_ -notmatch '^--- ') -and
            ($_ -notmatch '^\+\+\+ ') -and
            ($_ -cne '-    runs-on: windows-latest') -and
            ($_ -cne '+    runs-on: [self-hosted, Windows, X64, hms-ai-router-windows]')
          })
          if ($removed.Count -ne 1 -or $added.Count -ne 1 -or $otherPayload.Count -ne 0) {
            $diff | ForEach-Object { Write-Host $_ }
            throw 'Activation candidate diff contains changes outside the single reviewed runner selector substitution'
          }
          [pscustomobject]@{
            selector_diff_verified = $true
            tooling_revision = $env:GITHUB_SHA
            isolated_workspace = $true
            serialized_fallback = $true
            removed_hosted_selector = $removed.Count
            added_self_hosted_selector = $added.Count
            other_payload_changes = $otherPayload.Count
            candidate_committed = $false
            candidate_executed = $false
            windows_graph_executed = $false
            windows_runtime_certified = $false
            authority = 'ACTIVATION_PATCH_ONLY_NOT_WINDOWS_PROOF'
          } | ConvertTo-Json -Compress

      - name: Remove activation candidate
        if: always()
        shell: powershell
        run: |
          $candidate = Join-Path $env:RUNNER_TEMP $env:HMS_CANDIDATE_NAME
          if (Test-Path -LiteralPath $candidate) {
            Remove-Item -LiteralPath $candidate -Force
          }
