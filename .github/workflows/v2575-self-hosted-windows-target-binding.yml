name: v25.75 Self-Hosted Windows Target Binding (Fallback Only)

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact HMS-AI-ROUTER commit to bind before qualification
        required: true
        default: e1935127a4c62573426d146c164ded04e1f0bb53
        type: string
      expected_workflow_blob:
        description: Reviewed git blob SHA of canonical Windows Promotion Safety workflow
        required: true
        default: 4798c8fbca4f56485fbef3bbd9e8016b6e039745
        type: string

permissions:
  contents: read

concurrency:
  group: v2575-self-hosted-windows-fallback
  cancel-in-progress: false

jobs:
  target-binding:
    runs-on: [self-hosted, Windows, X64, hms-ai-router-windows]
    timeout-minutes: 5
    env:
      HMS_TARGET_SHA: ${{ inputs.target_sha }}
      HMS_EXPECTED_WORKFLOW_BLOB: ${{ inputs.expected_workflow_blob }}
      HMS_TARGET_DIR: target-${{ github.run_id }}-${{ github.run_attempt }}
      HMS_TOOLING_DIR: fallback-tools-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Runner materialized
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_OS -ne 'Windows') { throw "Expected Windows runner, got '$env:RUNNER_OS'" }
          if ($env:RUNNER_ARCH -ne 'X64') { throw "Expected X64 runner, got '$env:RUNNER_ARCH'" }
          Write-Host 'SELF_HOSTED_WINDOWS_RUNNER_MATERIALIZED'

      - name: Refuse current-run workspace collision
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @($env:HMS_TARGET_DIR, $env:HMS_TOOLING_DIR)) {
            if (Test-Path -LiteralPath $path) {
              throw "Refusing pre-existing current-run workspace path '$path'"
            }
          }

      - name: Checkout exact target
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.target_sha }}
          path: target-${{ github.run_id }}-${{ github.run_attempt }}
          clean: true
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact workflow tooling revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: fallback-tools-${{ github.run_id }}-${{ github.run_attempt }}
          clean: true
          persist-credentials: false
          fetch-depth: 1

      - name: Bind exact qualification target
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tool = Join-Path $env:HMS_TOOLING_DIR 'scripts\assert_windows_qualification_target.ps1'
          $target = Resolve-Path $env:HMS_TARGET_DIR
          & $tool `
            -ExpectedCommit $env:HMS_TARGET_SHA `
            -ExpectedWorkflowBlob $env:HMS_EXPECTED_WORKFLOW_BLOB `
            -RepositoryRoot $target

      - name: Declare non-proof boundary
        shell: powershell
        run: |
          [pscustomobject]@{
            target_binding_completed = $true
            tooling_revision = $env:GITHUB_SHA
            isolated_workspace = $true
            serialized_fallback = $true
            windows_graph_executed = $false
            windows_runtime_certified = $false
            authority = 'TARGET_BINDING_ONLY_NOT_WINDOWS_PROOF'
          } | ConvertTo-Json -Compress
